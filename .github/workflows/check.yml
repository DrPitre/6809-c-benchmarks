name: Benchmark matrix

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        optimization: ["-O0", "-O2"]
    steps:
      - uses: actions/checkout@v4
      - name: Build kernels
        run: make all CC=${{ matrix.compiler }} CFLAGS="${{ matrix.optimization }} -std=c89 -pedantic -Wall -Wextra -Werror"
      - name: Verify shared kr16 kernels on host
        env:
          CC: ${{ matrix.compiler }}
          CFLAGS: ${{ matrix.optimization }} -std=c89 -pedantic -Wall -Wextra
        run: python3 tools/check-kr16.py
      - name: Record correctness
        if: always()
        env:
          BENCH_CC: ${{ matrix.compiler }}
          BENCH_FLAGS: ${{ matrix.optimization }} -std=c89 -pedantic -Wall -Wextra -Werror
        run: python3 tools/check.py --json reports/${{ matrix.compiler }}${{ matrix.optimization }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.compiler }}${{ matrix.optimization }}
          path: reports/*.json
          if-no-files-found: error

  cmoc:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        optimization: ["0", "2"]
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential bison flex curl
      - name: Build CMOC 0.1.101, LWTOOLS, and pinned USIM
        run: sh tools/build-cmoc.sh
      - name: Run 6809 checks and record sizes
        if: always()
        run: |
          export PATH="$PWD/build/toolchain/bin:$PATH"
          python3 tools/run-cmoc.py --optimization ${{ matrix.optimization }} --json reports/cmoc-O${{ matrix.optimization }}.json
      - name: Run shared kr16 kernels with CMOC
        if: always()
        run: python3 tools/run-kr16.py --compiler cmoc --optimization ${{ matrix.optimization }} --json reports/kr16-cmoc-O${{ matrix.optimization }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-cmoc-O${{ matrix.optimization }}
          path: reports/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cmoc-evidence-O${{ matrix.optimization }}
          path: |
            build/cmoc-O${{ matrix.optimization }}/
            build/kr16-cmoc-O${{ matrix.optimization }}/

  c3:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        optimizer: ["on", "off"]
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential bison flex curl git
      - name: Build pinned LWTOOLS dependency
        run: sh tools/build-cmoc.sh
      - name: Build pinned C3 host tools and runtime
        run: sh tools/build-c3.sh
      - name: Record C3 compatibility
        if: always()
        run: python3 tools/run-c3.py --optimizer ${{ matrix.optimizer }} --json reports/c3-${{ matrix.optimizer }}.json
      - name: Run shared kr16 kernels with C3
        if: always()
        run: |
          level=0
          if [ "${{ matrix.optimizer }}" = on ]; then level=2; fi
          python3 tools/run-kr16.py --compiler c3 --optimization "$level" --json reports/kr16-c3-${{ matrix.optimizer }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-c3-${{ matrix.optimizer }}
          path: reports/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-evidence-${{ matrix.optimizer }}
          path: |
            build/c3-${{ matrix.optimizer }}/
            build/kr16-c3-*/

  llvm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        optimization: ["0", "2"]
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential bison flex curl xz-utils
      - name: Build pinned simulator dependency
        run: sh tools/build-cmoc.sh
      - name: Install pinned LLVM-MC6809 1.1.0-rc2
        run: sh tools/install-llvm.sh
      - name: Run shared kr16 kernels with LLVM
        if: always()
        run: python3 tools/run-kr16.py --compiler llvm --optimization ${{ matrix.optimization }} --json reports/kr16-llvm-O${{ matrix.optimization }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-llvm-O${{ matrix.optimization }}
          path: reports/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llvm-evidence-O${{ matrix.optimization }}
          path: build/kr16-llvm-O${{ matrix.optimization }}/

  vbcc:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        optimization: ["0", "2"]
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential bison flex curl unzip
      - name: Build pinned simulator dependency
        run: sh tools/build-cmoc.sh
      - name: Install pinned vbcc 6809 preview
        run: sh tools/install-vbcc.sh
      - name: Run shared kr16 kernels with vbcc
        if: always()
        run: python3 tools/run-kr16.py --compiler vbcc --optimization ${{ matrix.optimization }} --json reports/kr16-vbcc-O${{ matrix.optimization }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-vbcc-O${{ matrix.optimization }}
          path: reports/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vbcc-evidence-O${{ matrix.optimization }}
          path: build/kr16-vbcc-O${{ matrix.optimization }}/

  gcc6809:
    runs-on: ubuntu-latest
    env:
      GCC6809_SOURCE_DIR: ${{ github.workspace }}/build/sources/gcc6809
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential bison flex curl libgmp-dev libmpfr-dev libmpc-dev texinfo
      - name: Cache pinned GNU toolchain
        id: gcc-cache
        uses: actions/cache/restore@v4
        with:
          path: build/gcc6809
          key: gcc6809-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/build-gcc6809.sh', 'tools/gcc6809_sources.py', 'tools/gcc6809-sources.json') }}
      - name: Build gcc6809, binutils, newlib, and libgcc
        if: steps.gcc-cache.outputs.cache-hit != 'true'
        run: sh tools/build-gcc6809.sh
      - name: Save the built toolchain before correctness checks
        if: steps.gcc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/gcc6809
          key: ${{ steps.gcc-cache.outputs.cache-primary-key }}
      - name: Build the common pinned simulator
        run: sh tools/build-cmoc.sh
      - name: Run shared kr16 kernels with gcc6809 at O0
        if: always()
        run: python3 tools/run-kr16.py --compiler gcc6809 --optimization 0 --json reports/kr16-gcc6809-O0.json
      - name: Run shared kr16 kernels with gcc6809 at O2
        if: always()
        run: python3 tools/run-kr16.py --compiler gcc6809 --optimization 2 --json reports/kr16-gcc6809-O2.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-gcc6809
          path: reports/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gcc6809-evidence
          path: |
            build/kr16-gcc6809-O*/
            build/gcc6809/source-manifest.json

  matrix:
    needs: [check, cmoc, c3, llvm, vbcc, gcc6809]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          merge-multiple: true
          path: reports
      - name: Verify report handling
        run: python3 -m unittest discover -s tests
      - name: Generate matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          python3 tools/matrix.py reports build/site --expected-reports 18 \
            --run-started-at "$started" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat build/site/matrix.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-matrix
          path: build/site
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: build/site

  publish:
    needs: matrix
    if: always() && needs.matrix.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy matrix
        id: deployment
        uses: actions/deploy-pages@v4
